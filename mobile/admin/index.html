<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://chlmqnrvnrgeaihryreb.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>Helm Ops — Super admin</title>
<link rel="icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Même charte que le super admin Bar Ops */
:root{--bg:#080808;--surface:#0f0f0f;--surface2:#141414;--border:#222;--border2:#2a2a2a;--text:#ede8e0;--text2:#a09890;--text3:#585450;
  --gold:#d9a637;--gold-bg:rgba(217,166,55,.12);--gold-border:rgba(217,166,55,.32);--red:#d9564f;--red-bg:rgba(217,86,79,.14);--green:#3fb37c;--green-bg:rgba(63,179,124,.14);--r:5px;--rl:8px}
@media (prefers-color-scheme: light){:root{--bg:#f5f3ef;--surface:#fff;--surface2:#f0ede8;--border:#ddd9d2;--border2:#ccc8c0;--text:#1a1814;--text2:#6b6560;--text3:#a09890;--gold:#a97f2e;--gold-bg:rgba(169,127,46,.10);--gold-border:rgba(169,127,46,.28);--red:#c23a3a;--red-bg:rgba(194,58,58,.10);--green:#2f8a5e;--green-bg:rgba(47,138,94,.10)}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);font-size:14px;font-weight:300;-webkit-font-smoothing:antialiased}
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0 8px}
.logo{padding:28px 12px 22px;margin:0 -8px 12px;border-bottom:1px solid var(--border);padding-left:20px}
.side h1{font-size:15px;color:var(--gold);letter-spacing:.12em;font-weight:400;text-transform:uppercase}
.logo-rule{width:24px;height:1px;background:var(--gold-border);margin-top:10px}
.side p{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-top:10px;font-weight:400}
.sec{font-size:8px;text-transform:uppercase;letter-spacing:.2em;color:var(--text3);padding:10px 12px 5px}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-left:1px solid transparent;color:var(--text3);text-align:left;padding:10px 14px;margin-bottom:1px;font:400 12px 'Jost',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:var(--r);transition:.2s}
.nav svg{width:14px;height:14px;flex-shrink:0;opacity:.5;fill:none;stroke:currentColor;stroke-width:1.2}
.nav:hover{color:var(--text2);background:var(--surface2)}.nav.on{color:var(--gold);background:var(--gold-bg);border-left-color:var(--gold-border)}.nav.on svg{opacity:1}
.foot{margin:auto -8px 0;padding:14px 16px;border-top:1px solid var(--border)}
.who{font-size:10px;color:var(--text3);letter-spacing:.04em;word-break:break-all}
.foot .nav{padding:8px 0;margin-top:6px}
.main{flex:1;min-width:0;overflow-y:auto;padding:0 28px 40px}
h2{font-weight:300;font-size:28px;letter-spacing:.08em;color:var(--gold);margin:0 -28px 24px;padding:16px 28px;min-height:69px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
h3{display:flex;align-items:center;gap:8px;font-size:8px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin:28px 0 14px}
h3::after{content:'';flex:1;height:1px;background:var(--border)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid transparent;border-radius:var(--rl);padding:16px 20px;display:flex;flex-direction:column-reverse;gap:6px;transition:border-color .2s}
.kpi:hover{border-color:var(--border2)}
.kpi b{display:block;font-size:28px;font-weight:300;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.kpi span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;background:var(--surface);border-radius:var(--rl);padding:38px 20px 20px}
.bars div{flex:1;background:var(--gold-bg);border-top:1px solid var(--gold);border-radius:2px 2px 0 0;min-height:1px;position:relative;transition:background .2s}
.bars div:hover{background:var(--gold-border)}
.bars div i{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:var(--text2)}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--rl);overflow:hidden}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle;font-variant-numeric:tabular-nums}
th{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-weight:400}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:3px;font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;background:var(--surface2);color:var(--text2);white-space:nowrap}
.tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.tag.ok{background:var(--green-bg);color:var(--green)}.tag.ko{background:var(--red-bg);color:var(--red)}.tag.gold{background:var(--gold-bg);color:var(--gold)}
input{height:36px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--r);padding:0 11px;font:300 12px 'Jost',sans-serif;outline:none;transition:.2s}
input:focus{border-color:var(--gold-border)}
button.btn{display:inline-flex;align-items:center;height:36px;background:none;border:1px solid var(--border2);color:var(--text2);border-radius:4px;padding:0 16px;font:500 10px 'Jost',sans-serif;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:.2s}
button.btn:hover{border-color:var(--gold-border);color:var(--gold)}
button.btn.red{color:var(--red);border-color:var(--red-bg)}button.btn.red:hover{border-color:var(--red)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:12px}
.muted{color:var(--text3)}.err{color:var(--red);margin:12px 0;font-size:12px;letter-spacing:.04em}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:16px}
.gate h1{font-weight:300;font-size:28px;letter-spacing:.08em;color:var(--gold)}
.dl{display:grid;grid-template-columns:180px 1fr;background:var(--surface);border-radius:var(--rl);padding:6px 20px;font-size:12px}
.dl dt,.dl dd{padding:9px 0;border-bottom:1px solid var(--border)}
.dl dt{color:var(--text3);font-size:11px}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:none}
@media (max-width:760px){.shell{flex-direction:column;height:auto;overflow:visible}.side{width:auto;flex-direction:row;flex-wrap:wrap;padding:8px}.logo,.sec,.foot{display:none}.nav{width:auto;border-left:none;font-size:10px;padding:8px 12px}.main{padding:0 16px 30px}h2{margin:0 -16px 18px;padding:16px;font-size:22px}.dl{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <h1>Helm Ops — Super admin</h1>
  <p id="gateMsg" class="muted">Connectez-vous avec un compte autorisé.</p>
  <button class="btn" id="loginBtn">Se connecter avec Google</button>
  <button class="btn" id="logoutBtn" hidden>Changer de compte</button>
</div>
<div id="app" class="shell" hidden>
  <nav class="side">
    <div class="logo"><h1>Helm Ops</h1><div class="logo-rule"></div><p>Super admin</p></div>
    <div class="sec">Pilotage</div>
    <button class="nav" data-v="overview"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="7" rx="1"/><rect x="9" y="1" width="6" height="4" rx="1"/><rect x="1" y="10" width="6" height="5" rx="1"/><rect x="9" y="7" width="6" height="8" rx="1"/></svg>Vue d'ensemble</button>
    <button class="nav" data-v="accounts"><svg viewBox="0 0 16 16"><circle cx="6" cy="5" r="2.5"/><path d="M1.5 14c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5"/><path d="M11 3a2.5 2.5 0 010 5M12.5 9.8c1.2.6 2 1.9 2 3.4"/></svg>Comptes</button>
    <div class="sec">Plateforme</div>
    <button class="nav" data-v="health"><svg viewBox="0 0 16 16"><path d="M1 8.5h3l2-5 3 9 2-4h4"/></svg>Santé</button>
    <div class="foot"><div class="who" id="who"></div>
    <button class="nav" id="signOut">Se déconnecter</button></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Jetons du retour Google, capturés avant que Supabase ne nettoie l'URL (pour les renvoyer à Ops HQ)
const OAUTH_RETURN = /^#access_token=[A-Za-z0-9_\-.=&%/+]+$/.test(location.hash) ? location.hash : '';
const SUPABASE_URL = 'https://chlmqnrvnrgeaihryreb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNobG1xbnJ2bnJnZWFpaHJ5cmViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNTQ1MjMsImV4cCI6MjA5ODczMDUyM30.ErgkAYc0mVv6iyEeIDtJ8kKaX6ExyNi4ribi_rvqX6s';
const API = SUPABASE_URL + '/functions/v1/admin';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'implicit', storageKey: 'helm-superadmin' } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const d = s => s ? new Date(s).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const dt = s => s ? new Date(s).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const eur = n => (n || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });

async function api(path, body) {
  // Dans Ops HQ, l'app Mac ajoute elle-même la clé admin (x-admin-key) : pas besoin de session
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(API + path, {
    method: body ? 'POST' : 'GET',
    headers: { ...(session ? { Authorization: 'Bearer ' + session.access_token } : { 'x-admin-key': 'ops-hq' }), apikey: SUPABASE_ANON_KEY, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'HTTP ' + r.status), { status: r.status });
  return j;
}

function subTag(a) {
  if (a.suspended) return '<span class="tag ko">Suspendu</span>';
  if (!a.sub) return '<span class="tag">Sans abonnement</span>';
  if (a.sub.status === 'past_due') return '<span class="tag ko">Paiement en échec</span>';
  if (!a.active) return '<span class="tag">Expiré</span>';
  if (a.sub.period === 'gift') return '<span class="tag gold">Offert</span>';
  return '<span class="tag ok">' + esc(a.sub.status === 'active' ? 'Payant' : a.sub.status) + '</span>';
}

const views = {
  async overview() {
    const o = await api('?view=overview');
    const max = Math.max(1, ...o.weeks.map(w => w.n));
    return `<h2>Vue d'ensemble</h2><div class="kpis">
      ${[['Utilisateurs', o.users], ['Abonnés payants', o.paying], ['MRR estimé', eur(o.mrr)], ['ARR estimé', eur(o.arr)], ['Accès offerts', o.gifted], ['Paiements en échec', o.pastDue], ['Expirés', o.expired], ['Sans abonnement', o.noSub], ['Inscrits 7 j', o.signups7], ['Inscrits 30 j', o.signups30], ['Actifs 7 j', o.active7], ['Actifs 30 j', o.active30], ['Suspendus', o.suspended]]
        .map(([k, v]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('')}
      </div><p class="muted" style="margin-top:8px;font-size:12px">MRR estimé au tarif actuel (9,90 €/mois), hors accès offerts.</p>
      <h3>Inscriptions par semaine (12 semaines)</h3>
      <div class="bars" style="margin-top:20px">${o.weeks.map(w => `<div title="Semaine du ${esc(d(w.start))}" style="height:${(w.n / max) * 100}%"><i>${w.n || ''}</i></div>`).join('')}</div>
      <h3>À surveiller</h3>${o.watch.length ? `<table><tr><th>Compte</th><th>Raison</th></tr>${o.watch.map(w => `<tr class="click" data-id="${esc(w.id)}"><td>${esc(w.email)}</td><td>${esc(w.why)}</td></tr>`).join('')}</table>` : '<p class="muted">Rien à signaler.</p>'}`;
  },
  async accounts() {
    const list = (await api('?view=accounts')).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    window._accounts = list;
    return `<h2>Comptes <span class="muted" style="font-size:18px">(${list.length})</span></h2>
      <div class="row"><input id="q" placeholder="Rechercher un e-mail ou un nom" style="min-width:280px"></div>
      <table id="accTable"><tr><th>Compte</th><th>Abonnement</th><th>Échéance</th><th>Inscrit le</th><th>Dernière activité</th></tr>
      ${list.map(a => `<tr class="click" data-id="${esc(a.id)}" data-s="${esc((a.email + ' ' + a.name).toLowerCase())}"><td>${esc(a.email)}<br><span class="muted" style="font-size:12px">${esc(a.name)} ${a.provider ? '· ' + esc(a.provider) : ''}</span></td><td>${subTag(a)}</td><td>${esc(d(a.sub?.expiresAt))}</td><td>${esc(d(a.createdAt))}</td><td>${esc(dt(a.lastActive))}</td></tr>`).join('')}</table>`;
  },
  async account(id) {
    const a = await api('?view=account&id=' + encodeURIComponent(id));
    return `<p><a href="#accounts" style="color:var(--gold)">← Comptes</a></p><h2 style="margin-top:10px">${esc(a.email)}</h2>
      <dl class="dl"><dt>Nom</dt><dd>${esc(a.name || '—')}</dd><dt>Connexion</dt><dd>${esc(a.provider || '—')}</dd>
      <dt>Inscrit le</dt><dd>${esc(dt(a.createdAt))}</dd><dt>Dernière connexion</dt><dd>${esc(dt(a.lastSignIn))}</dd>
      <dt>Dernière activité</dt><dd>${esc(dt(a.lastActive))}</dd><dt>Abonnement</dt><dd>${subTag(a)} ${a.sub ? esc(a.sub.period) + ' · échéance ' + esc(d(a.sub.expiresAt)) : ''}</dd>
      <dt>Stripe</dt><dd>${esc(a.sub?.stripeId || '—')}</dd><dt>Identifiant</dt><dd class="muted">${esc(a.id)}</dd></dl>
      <h3>Prolonger l'accès</h3><div class="row"><input id="days" type="number" min="1" max="730" value="30" style="width:100px"> jours
        <button class="btn" data-act="extend">Prolonger</button></div>
      <p class="muted" style="font-size:12px">À partir de la date la plus tardive entre aujourd'hui et l'échéance actuelle. Sans abonnement, crée un accès offert.</p>
      <h3>Suspension</h3><div class="row">${a.suspended ? '<button class="btn" data-act="reactivate">Réactiver le compte</button>' : '<button class="btn red" data-act="suspend">Suspendre le compte</button>'}</div>
      <p class="muted" style="font-size:12px">Une suspension empêche toute connexion. Une session déjà ouverte reste valable une heure au plus.</p>
      <h3>Historique des abonnements</h3>${a.subs.length ? `<table><tr><th>Créé le</th><th>Statut</th><th>Période</th><th>Échéance</th></tr>${a.subs.map(s => `<tr><td>${esc(d(s.created_at))}</td><td>${esc(s.status)}</td><td>${esc(s.period)}</td><td>${esc(d(s.expires_at))}</td></tr>`).join('')}</table>` : '<p class="muted">Aucun.</p>'}
      <div id="actMsg"></div>`;
  },
  async health() {
    const h = await api('?view=health');
    return `<h2>Santé</h2><table><tr><th>Contrôle</th><th>État</th><th>Détail</th></tr>
      ${h.checks.map(c => `<tr><td>${esc(c.name)}</td><td><span class="tag ${c.ok ? 'ok' : 'ko'}">${c.ok ? 'OK' : 'Problème'}</span></td><td>${esc(c.detail)}</td></tr>`).join('')}</table>
      <h3>Secrets de la fonction</h3><div class="kpis">${Object.entries(h.env).map(([k, v]) => `<div class="kpi" style="padding:10px 12px"><span class="tag ${v ? 'ok' : 'ko'}">${v ? 'présent' : 'absent'}</span><div style="font-size:12px;margin-top:6px;word-break:break-all">${esc(k)}</div></div>`).join('')}</div>`;
  },
};

async function route() {
  const [v, id] = (location.hash.slice(1) || 'overview').split('/');
  document.querySelectorAll('.nav[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === (v === 'account' ? 'accounts' : v)));
  const main = $('#main');
  main.innerHTML = '<p class="muted">Chargement…</p>';
  try {
    main.innerHTML = await (views[v] || views.overview)(id);
  } catch (e) {
    if (e.status === 401 || e.status === 403) return showGate(e.status === 403 ? 'Ce compte n’est pas autorisé à accéder au super admin.' : 'Session expirée, reconnectez-vous.', e.status === 403);
    main.innerHTML = `<p class="err">Erreur : ${esc(e.message)}</p>`;
  }
}

function showGate(msg, forbidden) {
  $('#app').hidden = true; $('#gate').hidden = false;
  $('#gateMsg').textContent = msg;
  $('#loginBtn').hidden = !!forbidden; $('#logoutBtn').hidden = !forbidden;
}

document.addEventListener('click', async e => {
  const nav = e.target.closest('.nav[data-v]');
  if (nav) return void (location.hash = nav.dataset.v);
  const tr = e.target.closest('tr.click');
  if (tr) return void (location.hash = 'account/' + tr.dataset.id);
  const act = e.target.closest('[data-act]');
  if (act) {
    const id = location.hash.split('/')[1], action = act.dataset.act;
    const body = { action, id };
    if (action === 'extend') body.days = Number($('#days').value);
    if (action === 'suspend' && !confirm('Suspendre ce compte ? La personne ne pourra plus se connecter.')) return;
    act.disabled = true;
    try { await api('', body); await route(); }
    catch (err) { act.disabled = false; $('#actMsg').innerHTML = `<p class="err">${esc(err.message)}</p>`; }
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#accTable tr[data-s]').forEach(r => r.hidden = !!q && !r.dataset.s.includes(q));
});
window.addEventListener('hashchange', () => { if (!$('#app').hidden) route(); });

$('#loginBtn').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } });
$('#logoutBtn').onclick = $('#signOut').onclick = async () => { await sb.auth.signOut(); location.hash = ''; showGate('Connectez-vous avec un compte autorisé.'); };

(async function boot() {
  // Retour de Google : flow implicite, jetons dans le fragment d'URL
  let { data: { session } } = await sb.auth.getSession();
  if (/access_token=|error=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  // Session refusée (expirée, compte non autorisé) : on l'oublie pour tenter la clé admin d'Ops HQ
  if (session) { try { await api('?view=health'); } catch (e) { if (e.status === 401 || e.status === 403) { await sb.auth.signOut({ scope: 'local' }); session = null; } } }
  if (!session) {
    // Pas de session : on tente l'accès par clé admin (Ops HQ)
    try { await api('?view=health'); } catch (_) { return showGate('Connectez-vous avec un compte autorisé.'); }
    $('#who').textContent = 'Ops HQ';
    $('#signOut').hidden = true;
  } else $('#who').textContent = session.user.email;
  $('#gate').hidden = true; $('#app').hidden = false;
  if (OAUTH_RETURN && !/[?&]hq=1/.test(location.search)) {
    // Connexion faite dans le navigateur du Mac depuis Ops HQ (Google refuse les webviews) : on propose d'y revenir
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:9;background:var(--surface);border:1px solid var(--gold-border);border-radius:8px;padding:14px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)';
    b.innerHTML = '<span style="font-size:13px">Vous êtes connecté. Utilisez-vous Ops HQ ?</span>';
    const go = document.createElement('button'); go.className = 'btn'; go.textContent = 'Ouvrir dans Ops HQ';
    go.onclick = () => { location.href = 'opshq://helm' + OAUTH_RETURN; };
    const x = document.createElement('button'); x.className = 'btn'; x.textContent = 'Non'; x.onclick = () => b.remove();
    b.append(go, x); document.body.append(b);
  }
  route();
})();
</script>
</body>
</html>
